# ======================================================================
# CUSTOM BOOSTTRACK CONFIGURATION (Version 2.0)
# Optimized for static cameras and reducing ID switches during crossing occlusions.
# ======================================================================

det_thresh:
  default: 0.3
max_age:
  default: 60      # Reduced from 90 to 60 (2 seconds) to avoid retaining "ghost" tracks too long.
min_hits:
  default: 3
iou_threshold:
  default: 0.3

# --- DISABLE CAMERA MOTION COMPENSATION FOR CCTV/FIXED VIEWS ---
use_ecc:
  default: False   # Important: disable this for a stationary camera to reduce noise.
use_dlo_boost:
  default: True
use_duo_boost:
  default: True
dlo_boost_coef:
  default: 0.65

# --- MATHEMATICAL WEIGHTS (INTENDED TO ADDRESS THE CHILD-TRACKING CASE) ---
lambda_iou:
  default: 0.25    # Reduced from 0.5 -> 0.25 (less reliance on overlap).
lambda_mhd:
  default: 0.50    # Increased from 0.25 -> 0.50 (prioritize Kalman/velocity to distinguish standing from running).
lambda_shape:
  default: 0.25

with_reid:
  default: True
use_rich_s:
  default: False
use_sb:
  default: False
use_vt:
  default: False
